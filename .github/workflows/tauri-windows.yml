name: Tauri Windows offline app

on:
  workflow_dispatch:
    inputs:
      clips:
        description: 'Fetch the 24 film clips (the Blogger mirror throttles CI, so this can fail)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'desktop/tauri/**'
      - '.github/workflows/tauri-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri

      - name: Build the site (desktop flag, full audio set)
        run: |
          npm ci
          MENSCHEN_DESKTOP=1 CF_PAGES= npm run build

      - name: Film-Stationen clips (1080p, optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clips }}
        continue-on-error: true
        run: |
          command -v ffmpeg >/dev/null || choco install ffmpeg -y --no-progress
          python desktop/tauri/scripts/fetch-clips.py || true
          mkdir -p dist/assets/clips
          cp desktop-cache/clips-1080/*.mp4 dist/assets/clips/ || echo "clips missing, building without them"

      - name: Build the Tauri shell
        working-directory: desktop/tauri
        run: |
          npx --yes @tauri-apps/cli@2 icon app-icon.png
          cd src-tauri
          cargo build --release

      - name: Assemble the portable folder
        run: |
          out=build/Menschen-tauri
          mkdir -p "$out"
          cp desktop/tauri/src-tauri/target/release/menschen.exe "$out/Menschen.exe"
          cp -r dist "$out/site"
          cp desktop/tauri/START-HERE.txt "$out/"

      - name: Benchmark and screenshot
        shell: pwsh
        run: ./desktop/tauri/scripts/bench.ps1 -Exe "$PWD/build/Menschen-tauri/Menschen.exe" -OutDir "$PWD/build/bench"

      - uses: actions/upload-artifact@v4
        with:
          name: menschen-tauri-small-files
          path: |
            build/bench/*
            build/Menschen-tauri/Menschen.exe
          retention-days: 14

      - name: Zip (store, no compression)
        run: |
          cd build
          # The benchmark leaves WebView2 runtime state (data/EBWebView, with a locked file)
          # next to the exe. It is not part of the app, and 7z exits 1 on the locked file.
          rm -rf Menschen-tauri/data
          7z a -tzip -mx0 menschen-tauri-portable.zip Menschen-tauri
          ls -la menschen-tauri-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: menschen-tauri-portable
          path: build/menschen-tauri-portable.zip
          compression-level: 0
          retention-days: 14
