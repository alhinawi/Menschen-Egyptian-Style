name: Android APK emulator test

# Manual-only workflow: builds the APK from this repo and tests it on a
# hardware-accelerated Android emulator (free public runner with KVM).
#
# Why build here instead of downloading the delivered APK: the repo is
# public, so release assets would be a new public distribution of the
# bundled book, and gofile has no unauthenticated direct-download API.
# Building from the same commit + android/build-apk.sh keeps everything
# private-by-construction. The CI APK is signed with a throwaway keystore,
# so it is not byte-identical to the delivered APK; the delivered file's
# own integrity is covered by the md5/apksigner checks done at upload.
#
# Evidence (screenshots, UI dumps, logcat, install record) is uploaded as
# the "emulator-test-evidence" run artifact with 2-day retention; the run
# and its artifacts are deleted after the evidence is reviewed.
#
# Scope note: validates install/launch/WebView rendering/offline behaviour
# on a current Android image (API 34, google_apis x86_64), plus a
# best-effort offline audio playback/seek check on a lesson page (blind
# accessibility taps, recorded either way). minSdk 24 era devices ship
# older System WebViews than real phones (WebView updates via Google
# Play), so they need a physical-device pass. Film clips are fetched only
# when the clips input is enabled (the Blogger mirror throttles CI);
# without them, media evidence covers the bundled audio, not the films.

on:
  workflow_dispatch:
    inputs:
      clips:
        description: 'Also fetch the 24 film clips before building (can fail: mirror throttles CI)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the offline site
        run: MENSCHEN_DESKTOP=1 CF_PAGES= npm run build

      - name: Film-Stationen clips (optional)
        if: ${{ inputs.clips }}
        continue-on-error: true
        run: |
          python3 desktop/tauri/scripts/fetch-clips.py || true
          mkdir -p dist/assets/clips
          cp desktop-cache/clips-1080/*.mp4 dist/assets/clips/ 2>/dev/null || true
          ls dist/assets/clips/ | wc -l

      - name: Build the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          KEYSTORE="$RUNNER_TEMP/test.keystore"
          TMPDIR="$RUNNER_TEMP" BT="$BT" PLATFORM="$PLATFORM" KEYSTORE="$KEYSTORE" \
            android/build-apk.sh dist app.apk
          mkdir -p evidence
          ls -la app.apk | tee evidence/apk-ls.txt
          md5sum app.apk | tee evidence/apk-md5.txt
          "$BT"/apksigner verify --print-certs app.apk | tee evidence/apksigner.txt
          df -h . | tee evidence/disk.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and test APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -x
            mkdir -p evidence
            adb wait-for-device
            adb shell input keyevent 82

            # Tap the first node whose text or content-desc matches $1.
            tap_node() {
              adb shell uiautomator dump /sdcard/uiw.xml >/dev/null 2>&1
              adb shell cat /sdcard/uiw.xml > evidence/ui-work.xml
              B=$(grep -oE '(text|content-desc)="[^"]*'"$1"'[^"]*"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' evidence/ui-work.xml | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | head -1)
              if [ -z "$B" ]; then return 1; fi
              X1=$(echo "$B" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\1/'); Y1=$(echo "$B" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\2/')
              X2=$(echo "$B" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\3/'); Y2=$(echo "$B" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\4/')
              adb shell input tap $(( (X1+X2)/2 )) $(( (Y1+Y2)/2 ))
              return 0
            }
            # Playback time text ("m:ss.s / m:ss.s") from the current UI dump.
            read_time() {
              grep -oE '[0-9]+:[0-9]{2}(\.[0-9])? / [0-9]+:[0-9]{2}(\.[0-9])?' "$1" | head -1
            }
            to_secs() {
              echo "$1" | awk -F'[:/ ]' '{m=$1; s=$2; print m*60+s}'
            }

            # Install the APK (over 1 GB, takes a few minutes)
            adb install app.apk | tee evidence/install.txt
            adb shell dumpsys package com.alhinawi.menschen | grep -E 'versionName|versionCode|firstInstallTime' | tee evidence/package.txt

            # Launch, let the WebView load the bundled site
            adb shell monkey -p com.alhinawi.menschen -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > evidence/01-home.png
            adb shell uiautomator dump /sdcard/ui.xml
            adb shell cat /sdcard/ui.xml > evidence/ui-home.xml

            # Tap "Open book" via its accessibility bounds (best effort)
            if tap_node 'Open book'; then
              sleep 8
              adb exec-out screencap -p > evidence/02-open-book.png
              adb shell uiautomator dump /sdcard/ui2.xml
              adb shell cat /sdcard/ui2.xml > evidence/ui-open-book.xml
            else
              echo "Open book node not found in accessibility tree" | tee evidence/open-book-missing.txt
            fi

            # Offline proof: kill radios, force-stop, relaunch
            adb root || true
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell am force-stop com.alhinawi.menschen
            adb shell monkey -p com.alhinawi.menschen -c android.intent.category.LAUNCHER 1
            sleep 20
            adb exec-out screencap -p > evidence/03-offline-home.png
            adb shell uiautomator dump /sdcard/ui3.xml
            adb shell cat /sdcard/ui3.xml > evidence/ui-offline.xml

            # Best-effort OFFLINE audio playback/seek proof on a lesson page.
            # Blind navigation is recorded either way; misses are evidence too.
            {
              echo "== offline audio test =="
              if ! tap_node 'Choose page'; then
                if tap_node 'Open book'; then sleep 8; fi
                tap_node 'Choose page'
              fi
              sleep 4
              adb shell uiautomator dump /sdcard/uip.xml >/dev/null 2>&1
              adb shell cat /sdcard/uip.xml > evidence/ui-pages.xml
              PAGE=""
              for cand in 15 10 6 20 25 30; do
                if tap_node '(^| |Seite )'"$cand"'$'; then PAGE=$cand; echo "opened page $cand"; break; fi
              done
              if [ -z "$PAGE" ]; then
                echo "NOT EXERCISED: no candidate page node found (see ui-pages.xml)"
              else
                sleep 8
                if tap_node 'Play (CD|Aufgabe)'; then
                  sleep 5
                  adb shell uiautomator dump /sdcard/uia1.xml >/dev/null 2>&1
                  adb shell cat /sdcard/uia1.xml > evidence/ui-audio1.xml
                  adb exec-out screencap -p > evidence/04-audio.png
                  T1=$(read_time evidence/ui-audio1.xml)
                  sleep 5
                  adb shell uiautomator dump /sdcard/uia2.xml >/dev/null 2>&1
                  adb shell cat /sdcard/uia2.xml > evidence/ui-audio2.xml
                  T2=$(read_time evidence/ui-audio2.xml)
                  echo "playback time: [$T1] -> [$T2]"
                  S1=$(to_secs "${T1%% /*}"); S2=$(to_secs "${T2%% /*}")
                  if [ -n "$S1" ] && [ -n "$S2" ] && [ "$(echo "$S2 > $S1 + 2" | bc)" = "1" ]; then
                    echo "OFFLINE AUDIO PLAYBACK CONFIRMED ($S1 s to $S2 s)"
                  else
                    echo "PLAYBACK NOT CONFIRMED from time texts"
                  fi
                  SB=$(grep -oE 'content-desc="Seek [^"]*"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' evidence/ui-audio2.xml | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | head -1)
                  if [ -n "$SB" ]; then
                    X1=$(echo "$SB" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\1/'); Y1=$(echo "$SB" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\2/')
                    X2=$(echo "$SB" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\3/'); Y2=$(echo "$SB" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\4/')
                    adb shell input tap $(( X1 + (X2-X1)*65/100 )) $(( (Y1+Y2)/2 ))
                    sleep 3
                    adb shell uiautomator dump /sdcard/uia3.xml >/dev/null 2>&1
                    adb shell cat /sdcard/uia3.xml > evidence/ui-audio3.xml
                    adb exec-out screencap -p > evidence/05-audio-seek.png
                    T3=$(read_time evidence/ui-audio3.xml)
                    S3=$(to_secs "${T3%% /*}")
                    echo "seek tap at 65%: time now [$T3]"
                    if [ -n "$S3" ] && [ -n "$S2" ] && [ "$(echo "$S3 > $S2 + 15" | bc)" = "1" ]; then
                      echo "AUDIO SEEK CONFIRMED ($S2 s to $S3 s)"
                    else
                      echo "SEEK NOT CONFIRMED from time texts"
                    fi
                  else
                    echo "SEEK NOT EXERCISED: no seek slider node"
                  fi
                else
                  echo "NOT EXERCISED: no Play node on page $PAGE"
                fi
              fi
            } 2>&1 | tee evidence/audio.txt

            # WebView / media errors
            adb logcat -d > evidence/logcat.txt
            grep -iE 'menschen|chromium|WebView|MediaPlayer|AudioTrack|AudioFlinger|cr_|FATAL' evidence/logcat.txt | tail -100 > evidence/logcat-filtered.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-test-evidence
          path: evidence/
          retention-days: 2
